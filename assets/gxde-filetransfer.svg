<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57c7ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>

    <linearGradient id="card" x1="24" y1="26" x2="104" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#dfeaff" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bg)"/>

  <!-- 文件夹 -->
